# Publish the game (the web/ folder) to GitHub Pages on every push to main.
# web/hivewise.wasm is built locally with .\build.ps1 and committed, so no Rust is needed here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      # give the fresh upload a moment to be listed (deploy-pages can miss it otherwise)
      - run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v5
